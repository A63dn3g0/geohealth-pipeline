name: GeoHealth MVP tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app.py etl analysis
      - run: python -m pytest -q

  live-geography-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify live official LHD polygons and geographic names
        run: |
          python -m etl.download --boundaries
          python -m etl.audit_geography --boundaries data/raw/nsw_lhd_boundaries.geojson

name: Tests & Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
      
      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics
      
      - name: Format check with black
        run: |
          black --check --diff .
      
      - name: Type check with mypy
        run: |
          mypy geohealth_pipeline_Project.py --ignore-missing-imports || true
      
      - name: Run unit tests
        run: |
          pytest test_geohealth_pipeline.py -v --tb=short
      
      - name: Run advanced tests
        run: |
          pytest test_geohealth_pipeline_advanced.py -v --tb=short
      
      - name: Generate coverage report
        run: |
          pytest . --cov=. --cov-report=xml --cov-report=html --cov-report=term -v
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
          verbose: true

  demo:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
      
      - name: Run demo pipeline
        run: |
          python geohealth_pipeline_Project.py --demo
      
      - name: Verify outputs
        run: |
          test -f ./outputs/geohealth.gpkg && echo "✓ GeoPackage created"
          test -f ./outputs/geohealth_lga.csv && echo "✓ CSV created"
          test -f ./outputs/geohealth_quickmap.png && echo "✓ PNG quickmap created"

version: '3.8'
services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: geohealth
      POSTGRES_USER: geohealth
      POSTGRES_PASSWORD: geohealth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
  dashboard:
    build: .
    command: streamlit run dashboard/main.py
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    depends_on:
      - db
volumes:
  pgdata:

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geohealth-pipeline"
version = "1.0.0"
description = "A modular, config-driven pipeline for integrating, transforming, and exporting Australian health and geography data at the LGA level"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "GeoHealth Team", email = "geohealth@example.com"}
]
keywords = ["geohealth", "lga", "pipeline", "Australia", "health", "geography", "gis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "pandas>=2.0.0,<3.0",
    "geopandas>=0.14.0,<1.0",
    "pyogrio>=0.8.0,<1.0",
    "shapely>=2.0.0,<3.0",
    "pyyaml>=6.0.0,<7.0",
    "numpy>=1.25.0,<2.0",
    "matplotlib>=3.7.0,<4.0",
    "sqlalchemy>=2.0.0,<3.0",
    "psycopg2-binary>=2.9.0,<3.0",
    "fastapi>=0.104.0,<1.0",
    "uvicorn>=0.24.0,<1.0",
    "streamlit>=1.28.0,<2.0",
    "great-expectations>=0.17.0,<1.0",
    "prefect>=3.0.0,<4.0",
    "python-dotenv>=1.0.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0,<24.0",
    "flake8>=6.0.0,<7.0",
    "pytest>=7.4.0,<8.0",
    "pytest-cov>=4.1.0,<5.0",
    "jupyterlab>=4.0.0,<5.0",
    "mypy>=1.5.0,<2.0",
    "isort>=5.12.0,<6.0",
]

[project.urls]
Homepage = "https://github.com/your-org/geohealth-pipeline"
Documentation = "https://github.com/your-org/geohealth-pipeline#readme"
Repository = "https://github.com/your-org/geohealth-pipeline.git"
Issues = "https://github.com/your-org/geohealth-pipeline/issues"

[project.scripts]
geohealth = "geohealth_pipeline_Project:main"

[tool.setuptools]
packages = ["etl", "api", "dashboard"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]
include = '\.pyi?$'
exclude = '''
/(
  \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.pytest.ini_options]
testpaths = [".", "tests"]
python_files = "test_*.py"
addopts = "--strict-markers --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = [".", "etl", "api", "dashboard"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

environment: python3.11

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

python:
  version: 3.11
  install:
    - requirements: requirements/requirements-dev.txt
    - method: pip
      path: .

sphinx:
  configuration: docs/conf.py
  builder: html
  fail_on_warning: false

formats:
  - pdf
  - epub

python:
  version: 3.11
  install:
    - requirements: requirements/requirements-dev.txt

build:
  jobs:
    pre_build:
      - pip install sphinx sphinx-rtd-theme myst-parser

version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: geohealth-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geohealth}
      POSTGRES_USER: ${POSTGRES_USER:-geohealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geohealth}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - geohealth_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: geohealth-pipeline:1.0.0
    container_name: geohealth-api
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn api.main:app --host ${API_HOST:-0.0.0.0} --port ${API_PORT:-8000} --workers ${API_WORKERS:-4}
    environment:
      PYTHONUNBUFFERED: 1
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./inputs:/app/inputs:ro
      - ./outputs:/app/outputs:rw
      - ./geohealth_config.yaml:/app/geohealth_config.yaml:ro
    restart: unless-stopped
    networks:
      - geohealth_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    image: geohealth-pipeline:1.0.0
    container_name: geohealth-dashboard
    command: streamlit run dashboard/main.py --server.port ${STREAMLIT_SERVER_PORT:-8501} --server.headless true --logger.level ${LOG_LEVEL:-info}
    environment:
      PYTHONUNBUFFERED: 1
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${STREAMLIT_SERVER_PORT:-8501}:8501"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./inputs:/app/inputs:ro
      - ./outputs:/app/outputs:ro
      - ./geohealth_config.yaml:/app/geohealth_config.yaml:ro
      - streamlit_cache:/app/.streamlit
    restart: unless-stopped
    networks:
      - geohealth_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: geohealth-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - dashboard
    networks:
      - geohealth_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
    driver: local
  streamlit_cache:
    driver: local

networks:
  geohealth_network:
    driver: bridge
